<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./common.js"></script>
    <script src="./GameObject.js"></script>
    <script src="./Block.js"></script>
    <script>
        //게임판 정의
        let rows = 20;  //세로 20줄
        let cols = 10;  //가로 10칸
        let board = Array.from({length:rows}, ()=> Array(cols).fill(0));

        let blockSize = 30; //블록 사이즈
        let block;
        let fallingBlocks = []; //모든 블럭 저장
        let blockMap =  Array.from({ length: rows }, () => Array(cols).fill(null)); //맵 안에 블럭 저장
        let interval=null;

        let score = 0;
        let level = 0;
        let gameOverFlag = false;   //게임이 오버되었는지 확인

        let holdPiece = null;   //보관 중인 블럭 정보
        let canHold = true;     //한 턴에 한 번만 보관

        /*----------------------------------------------------------------------------
            보드판 격자 생성 및 초기화
        ----------------------------------------------------------------------------*/
        function createBoard(){
            let gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';   //기존 게임 보드 초기화

            //각 셀을 화면에 그리기(20 * 10)
            for(let i=0; i<rows; i++){
                for(let j=0; j<cols; j++){
                    let cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    if(board[i][j] !== 0){
                        cell.classList.add('filled');
                    }
                    gameBoard.appendChild(cell);
                }
            }
        }

        //초기화 함수
        function init(){
            //블럭 요소 제거
            fallingBlocks.forEach(block => block.remove());
            fallingBlocks=[];

            //게임보드 초기화
            board = Array.from({length:rows}, ()=> Array(cols).fill(0));
            blockMap = Array.from({length:rows}, ()=> Array(cols).fill(null));

            //보드 새로 그리기
            createBoard();

            //점수와 레벨 초기화
            score = 0; level = 0;
            document.querySelector("#data span:nth-of-type(1)").innerText = score;  //score
            document.querySelector("#data span:nth-of-type(2)").innerText = level;  //level
            
            //버튼 초기화
            document.querySelector("#aside button").innerText = "GAME START";
            //게임 오버 플래그 초기화
            gameOverFlag = false;

            //인터벌 제거
            if(interval!= null){
                clearInterval(interval);
                interval = null;
            }
        }

        /*----------------------------------------------------------------------------
            블럭 생성
        ----------------------------------------------------------------------------*/
        function createBlock(){
            const tetroBlock = [
                { shape: [[1, 1, 1], [0, 1, 0]], color: 'red' }, // T 모양
                { shape: [[1, 1], [1, 1]], color: 'green' }, // O 모양
                { shape: [[1, 0, 0], [1, 1, 1]], color: 'blue' }, // L 모양
                { shape: [[0, 0, 1], [1, 1, 1]], color: 'yellow' }, // ㄱ 모양
                { shape: [[1, 1, 1, 1]], color: 'purple'}, // I 모양
                { shape: [[0, 1, 1], [1, 1, 0]], color: 'Lime'}, // ㄹ 모양
                { shape: [[1, 1, 0], [0, 1, 1]], color: 'Salmon'} // reverse ㄹ 모양
            ];
            let piece = tetroBlock[getRandom(tetroBlock.length-1)];
            let gameBoard = document.getElementById("gameBoard");

            //게임오버 감지
            for(let i=0; i<piece.shape.length; i++){
                for (let j = 0; j < piece.shape[i].length; j++) {
                    if (piece.shape[i][j] === 1) {
                        let x = j * blockSize + 90;   //중앙에서 시작하기
                        let y = i * blockSize;
                        const boardY = Math.floor(y / blockSize);
                        const boardX = Math.floor(x / blockSize);
                        if (board[boardY]?.[boardX] == 1) {
                            gameOverFlag = true;
                            return; // 블럭 생성하지 않고 종료
                        }
                    }
                }
            }

            //tetroBlock 배열에서 1인 곳마다 Block 생성
            for(let i=0; i<piece.shape.length; i++){
                for(let j=0; j<piece.shape[i].length; j++){
                    if(piece.shape[i][j] == 1){
                        let x = j * blockSize + 90;   //중앙에서 시작하기
                        let y = i * blockSize;

                        block = new Block(gameBoard, x, y, blockSize, blockSize, 0, 1, piece.color);
                        fallingBlocks.push(block);
                    }
                }
            }
            canHold = true;
        }

        /*----------------------------------------------------------------------------
            충돌 검사(충돌 시 return true)
        ----------------------------------------------------------------------------*/
        //아래 충돌
        function collisionBottom(block){
            //바닥과 충돌
            if(block.y + block.height >= rows * blockSize) return true;

            //블럭 간섭
            let row = Math.floor((block.y + block.height) / blockSize);
            let col = Math.floor(block.x / blockSize);

            //보드 밖으로 벗어남 확인
            if (row >= rows || col < 0 || col >= cols) return true;

            //블럭이 있는지 확인
            return board[row][col] !== 0; 
        }

        //좌우측 충돌
        function collisionSide(blockArray, flag){
            for(let block of blockArray){
                let row = Math.floor(block.y / blockSize);
                let col = Math.floor(block.x / blockSize);

                if(flag == "left"){ //좌측 충돌
                    if(col <= 0 || board[row][col-1]!==0) return true;
                }else if(flag == "right"){  //우측 충돌
                    if(col >= cols-1 || board[row][col+1]!==0) return true;
                }
                // return board[row][col-1] !== 0; //블럭 확인
            }
            return false;
        }

        /*----------------------------------------------------------------------------
            블럭 회전하기
        ----------------------------------------------------------------------------*/
        function rotationBlock(blockArray){
            /*방법1) Block객체를 BlockGroup으로 묶어서 처리하기
                -> (장점) 코드 간결화, 유지보수성 향상, 식별성 향상 
                -> (단점) 대공사.. 대부분의 코드를 뜯어 고쳐야 함, 시간 부족
              방법2) 객체 자체의 x, y값을 변경하기
                -> (장점) 기존의 코드 변경 없이 작성 가능
                -> (단점) 복잡한 로직, 더러운 코드, 식별성 저하, 유지보수성 저하 
                    근데 어쩔수 없다.. 이걸로 ㄱㄱ    
            */

        //*************** 시간 관계상 방법 2로 진행, 이후에 리페토링 고려 (5/27) ***************
            let centerBlock = blockArray[1];    //중심 블럭 지정
            let centerX = centerBlock.x;
            let centerY = centerBlock.y;

            let rotated = blockArray.map(block => {
                let relX = Math.round((block.x - centerX) / blockSize);
                let relY = Math.round((block.y - centerY) / blockSize);

                // 시계 방향 회전
                let newRelX = -relY;
                let newRelY = relX;

                let newX = centerX + newRelX * blockSize;
                let newY = centerY + newRelY * blockSize;

                return {
                    ...block,   //구조분해
                    x: newX,
                    y: newY
                };
            });

            // 충돌 체크(충돌이면 true)
            let isValid = false;
            for(let block of rotated){
                let row = Math.floor(block.y / blockSize);
                let col = Math.floor(block.x / blockSize);
                if(row < 0 || row >= rows || col < 0 || col >= cols || board[row][col] !== 0){
                    isValid = true;
                    break;
                }
            }

            // 충돌 없으면 좌표 반영
            if(!isValid){
                for(let i = 0; i < blockArray.length; i++){
                    blockArray[i].x = rotated[i].x;
                    blockArray[i].y = rotated[i].y;
                }
            }
        }

        /*----------------------------------------------------------------------------
            하드 드롭(hard drop): 밑바닥(혹은 하단의 블럭) 위로 바로가기
                -> 스페이스 누를 시 호출
        ----------------------------------------------------------------------------*/
        function hardDrop(){
            //최상단에서 밑바닥까지의 최단거리 구함
            let bottom = rows * blockSize;
            for(let block of fallingBlocks){
                let drop = 0;
                let tempY = block.y;

                while(true){
                    tempY += blockSize;
                    let row = Math.floor(tempY / blockSize);
                    let col = Math.floor(block.x / blockSize);

                    if(row >= rows || board[row][col-1]!==0) break;
                    drop += blockSize;
                }
                if(drop < bottom) bottom = drop;
            }

            for(let block of fallingBlocks){
                if(!collisionBottom(block)){
                    //y값 지정
                    block.y += (bottom-blockSize);  //아래로 떨어지는 거리 보정
                }
            }
        }

        /*----------------------------------------------------------------------------
            한 줄 채우면 삭제
        ----------------------------------------------------------------------------*/
        //줄 삭제 후 블럭 아래로 이동
        function clearLines() {
            for (let row = rows - 1; row >= 0; row--) {
                let isFull = true;

                for (let col = 0; col < cols; col++) {
                    if (board[row][col] === 0) {
                        isFull = false;
                        break;
                    }
                }

                if (isFull) {
                    // 블록 제거
                    for (let col = 0; col < cols; col++) {
                        let block = blockMap[row][col];
                        if (block) {
                            block.remove(); // Block 클래스 안의 DOM element 제거
                        }
                    }

                    // 위의 모든 줄을 한 줄씩 아래로 내리기
                    for (let r = row; r > 0; r--) {
                        for (let c = 0; c < cols; c++) {
                            board[r][c] = board[r - 1][c];
                            blockMap[r][c] = blockMap[r - 1][c];

                            if (blockMap[r][c]) {
                                blockMap[r][c].y += blockSize;
                                blockMap[r][c].render(); // DOM 위치 갱신
                            }
                        }
                    }

                    // 맨 윗줄 비우기
                    for (let c = 0; c < cols; c++) {
                        board[0][c] = 0;
                        blockMap[0][c] = null;
                    }

                    row++; // 같은 줄 다시 체크 (위에서 내려온 게 있을 수 있으니)
                    score+=10;
                }
            }
        }

        /*----------------------------------------------------------------------------
            블록 보관(Hold)
        ----------------------------------------------------------------------------*/
        function holdBlock(){
            if(!canHold) return;    //한 턴에 한 번만 체크
            
            //복사본 저장
            let currentBlocks = fallingBlocks.map(b=>{
                new Block(document.getElementById("gameBoard"),b.x, b.y, b.width, b.height, b.velX, b.velY, b.color);
            });

            //기존 블록 삭제
            fallingBlocks.forEach(block => block.remove());
            fallingBlocks = [];


            if (holdPiece == null) {
                holdPiece = currentBlocks;
                createBlock(); // 랜덤 블록 새로 생성
            } else {
                let temp = holdPiece;
                holdPiece = currentBlocks;

                fallingBlocks = temp.map(b =>{
                    new Block(document.getElementById("gameBoard"), b.x, b.y, b.width, b.height, b.velX, b.velY, b.color);
                });
            }

            renderHoldBlock(holdPiece);
            canHold = false;
        }

        function renderHoldBlock(blocks){
            let holdArea = document.querySelector("#hold div");
            holdArea.innerText = "";

            let baseX = 30;
            let baseY = 30;

            if (!blocks || blocks.length === 0) return;

            const minX = Math.min(...blocks.map(b => b.x));
            const minY = Math.min(...blocks.map(b => b.y)); 

            for(let block of blocks){
                const offsetX = block.x / blockSize; // 블록 좌표를 셀 기준으로 변환
                const offsetY = block.y / blockSize;

                const x = baseX + offsetX * blockSize;
                const y = baseY + offsetY * blockSize;

                const newBlock = new Block(holdArea, x, y, blockSize, blockSize, 0, 0, "red");
                newBlock.render(); // 위치 반영
            }
        }

        /*----------------------------------------------------------------------------
            게임 오버
        ----------------------------------------------------------------------------*/
        function gameOver(){
            alert("GAME OVER!\n당신의 최종 점수는 "+score+"점 입니다.");
            init(); //초기화
        }

        /*----------------------------------------------------------------------------
            게임 루프 생성
        ----------------------------------------------------------------------------*/
        function gameLoop(){
            if(fallingBlocks.length === 0){
                createBlock();  //블럭 생성
                return;
            }

            let check = false;

            //블럭 아래로 떨어지기
            for(let i=0; i<fallingBlocks.length; i++){
                let block = fallingBlocks[i];
                if(!collisionBottom(block)){
                    block.tick();
                }else{
                    check = true;
                }
                block.render();
            }

            if(check){
                for(let i=0; i<fallingBlocks.length; i++){
                    let block = fallingBlocks[i];

                    let row = Math.floor(block.y / blockSize);
                    let col = Math.floor(block.x / blockSize);
                    if (row >= 0 && row < rows && col >= 0 && col < cols) {
                        board[row][col] = 1;
                        blockMap[row][col] = block;
                        block.div.style.backgroundColor = '#4A4A4A';
                    }
                }
                fallingBlocks = [];
                clearLines();
                createBlock();
            }
            level = Math.floor(score/50);
            document.querySelector("#data span:nth-of-type(1)").innerText = score;  //score
            document.querySelector("#data span:nth-of-type(2)").innerText = level;  //level
            
            //게임 오버
            if(gameOverFlag){
                gameOver();
            }
        }

        /*----------------------------------------------------------------------------
            로드 시
        ----------------------------------------------------------------------------*/
        addEventListener("load", function(){
            //게임 판 준비
            init();

            //Game Start 버튼 클릭 시
            let bt = document.querySelector("#aside button");
            bt.addEventListener("click", ()=>{
                //게임 시작
                if(interval == null){
                    interval = setInterval(gameLoop, 10 - (level * 2));
                    bt.innerText = "PAUSE";
                }else{
                    clearInterval(interval);
                    interval = null;
                    bt.innerText = "GAME START";
                }
            });

            //키보드 입력 처리
            document.addEventListener('keydown', (e)=>{
                switch(e.keyCode){
                    case 37:     //left
                    if(!collisionSide(fallingBlocks, "left")){
                        for(let block of fallingBlocks){
                                block.x -= blockSize;
                            }
                        }
                        break;
                    case 39:    //right
                    if(!collisionSide(fallingBlocks, "right")){
                        for(let block of fallingBlocks){
                                block.x += blockSize;
                            }
                        }
                        break;
                    case 38:    //up 
                        rotationBlock(fallingBlocks);
                        break;
                    case 40:    //down 
                        for(let block of fallingBlocks){
                            if(!collisionBottom(block)){
                                block.y += blockSize;
                            }
                        }
                        break;
                    case 32:    //space 
                        hardDrop();
                        e.preventDefault(); //스페이스로 버튼 눌림 방지
                        break;
                    case 67:    //c
                        holdBlock();
                        break;
                    case 27:    //esc
                        bt.click();
                        break;
                }
            });

            //모달 띄우기
            let modal = document.getElementById("myModal");
            let helpBt = document.querySelector("#aside a");
            let span = document.getElementById("close");

            helpBt.addEventListener("click", ()=>{
                modal.style.display = "block";
            });
            span.addEventListener("click", ()=>{
                modal.style.display = "none";
            });
            addEventListener("click", (e)=>{
                if(e.target == modal) modal.style.display = "none";
            });

        });
    </script>
</head>
<body>
    <div id="wrapper">
        <div id="aside">
            <div id="hold">
                <h2>HOLD</h2>
                <div></div>
            </div>
            <div id="data">
                <h2>SCORE</h2>
                <span></span>
                <h2>LEVEL</h2>
                <span></span>
            </div>
            <button>GAME START</button>
            <a href="#">help?▶</a>
            <!-- Create Custom Modal -->
            <div id="myModal" class="modal">
                <div class="modalContent" id="modalContent">
                    <span class="close" id="close">&times;</span>
                    <p>
                        <h1>게임 설명</h1>
                        <h2>키 설명</h2>
                        <h3> 방향키 → : 우측으로 한 칸 이동</h3>
                        <h3> 방향키 ← : 좌측으로 한 칸 이동</h3>
                        <h3> 방향키 ↓ : 아래로 한 칸 이동</h3>
                        <h3> 방향키 ↑ : 블럭 회전</h3>
                        <h3> 스페이스바 : 드롭 다운</h3>
                        <br>
                        <h2>점수</h2>
                        <h3>한 줄이 없어지면 10접을 획득합니다.</h3>
                        <h3>50점을 획득할 때마다 레벨이 1씩 올라갑니다.</h3>
                    </p>
                </div>
            </div>
        </div>
        <div id="content">
            <div id="gameContainer">
                <div id="gameBoard"></div>
            </div>
        </div>
    </div>
</body>
</html>
