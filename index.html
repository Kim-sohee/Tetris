<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./common.js"></script>
    <script src="./GameObject.js"></script>
    <script src="./Block.js"></script>
    <script>
        //게임판 정의
        let rows = 20;  //세로 20줄
        let cols = 10;  //가로 10칸
        let board = Array.from({length:rows}, ()=> Array(cols).fill(0));

        let blockSize = 30; //블록 사이즈
        let block;
        let fallingBlocks = []; //모든 블럭 저장
        let interval=null;

        let score = 0;
        let level = 0;

        /*----------------------------------------------------------------------------
            보드판 격자 생성 및 초기화
        ----------------------------------------------------------------------------*/
        function createBoard(){
            let gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';   //기존 게임 보드 초기화

            //각 셀을 화면에 그리기(20 * 10)
            for(let i=0; i<rows; i++){
                for(let j=0; j<cols; j++){
                    let cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    if(board[i][j] !== 0){
                        cell.classList.add('filled');
                    }
                    gameBoard.appendChild(cell);
                }
            }
        }

        //초기화 함수
        function init(){
            createBoard();
            document.querySelector("#data span:nth-of-type(1)").innerText = score;
            document.querySelector("#data span:nth-of-type(2)").innerText = level;
        }

        /*----------------------------------------------------------------------------
            블럭 생성
        ----------------------------------------------------------------------------*/
        function createBlock(){
            const tetroBlock = [
                { shape: [[1, 1, 1], [0, 1, 0]], color: 'red' }, // T 모양
                { shape: [[1, 1], [1, 1]], color: 'green' }, // O 모양
                { shape: [[1, 0, 0], [1, 1, 1]], color: 'blue' }, // L 모양
                { shape: [[0, 0, 1], [1, 1, 1]], color: 'yellow' }, // ㄱ 모양
                { shape: [[1, 1, 1, 1]], color: 'purple'}, // I 모양
                { shape: [[0, 1, 1], [1, 1, 0]], color: 'Lime'}, // ㄹ 모양
                { shape: [[1, 1, 0], [0, 1, 1]], color: 'Salmon'} // reverse ㄹ 모양
            ];
            let piece = tetroBlock[getRandom(tetroBlock.length-1)];
            let gameBoard = document.getElementById("gameBoard");

            //tetroBlock 배열에서 1인 곳마다 Block 생성
            for(let i=0; i<piece.shape.length; i++){
                for(let j=0; j<piece.shape[i].length; j++){
                    if(piece.shape[i][j] == 1){
                        let x = j * blockSize + 90;   //중앙에서 시작하기
                        let y = i * blockSize;

                        block = new Block(gameBoard, x, y, blockSize, blockSize, 0, 1, piece.color);
                        fallingBlocks.push(block);
                    }
                }
            }
        }

        /*----------------------------------------------------------------------------
            충돌 검사(충돌 시 return true)
        ----------------------------------------------------------------------------*/
        //아래 충돌
        function collisionBottom(block){
            //바닥과 충돌
            if(block.y + block.height >= rows * blockSize) return true;

            //블럭 간섭
            let row = Math.floor((block.y + block.height) / blockSize);
            let col = Math.floor(block.x / blockSize);

            //보드 밖으로 벗어남 확인
            if (row >= rows || col < 0 || col >= cols) return true;

            //블럭이 있는지 확인
            return board[row][col] !== 0;
        }
        //좌측 충돌
        function collisionLeft(block){
            let row = Math.floor(block.y / blockSize);
            let col = Math.floor(block.x / blockSize);

            if(col <= 0) return true; //왼쪽 벽 충돌

            return board[row][col-1] !== 0; //블럭간 충돌 확인
        }

        //우측 충돌
        function collisionRight(block){
            let row = Math.floor(block.y / blockSize);
            let col = Math.floor(block.x / blockSize);

            if(col >= cols-1) return true;  //오른쪽 벽 충돌

            return board[row][col-1] !== 0; //블럭간 충돌 확인
        }


        /*----------------------------------------------------------------------------
            게임 루프 생성
        ----------------------------------------------------------------------------*/
        function gameLoop(){
            if(fallingBlocks.length === 0){
                createBlock();  //블럭 생성
                return;
            }

            let check = false;

            //블럭 아래로 떨어지기
            for(let i=0; i<fallingBlocks.length; i++){
                let block = fallingBlocks[i];
                if(!collisionBottom(block)){
                    block.tick();
                }else{
                    check = true;
                }
                block.render();
            }

            if(check){
                for(let i=0; i<fallingBlocks.length; i++){
                    let block = fallingBlocks[i];

                    let row = Math.floor(block.y / blockSize);
                    let col = Math.floor(block.x / blockSize);
                    if (row >= 0 && row < rows && col >= 0 && col < cols) {
                        board[row][col] = 1;
                        block.div.style.backgroundColor = '#4A4A4A';
                    }
                }
                fallingBlocks = [];
                createBlock();
            }
            
        }

        /*----------------------------------------------------------------------------
            로드 시
        ----------------------------------------------------------------------------*/
        addEventListener("load", function(){
            //게임 판 준비
            init();

            //Game Start 버튼 클릭 시
            let bt = document.querySelector("#aside button");
            bt.addEventListener("click", ()=>{
                //게임 시작
                if(interval == null){
                    interval = setInterval(gameLoop, 10 - (level * 2));
                    bt.innerText = "PAUSE";
                }else{
                    clearInterval(interval);
                    interval = null;
                    bt.innerText = "GAME START";
                }
            });

            //키보드 입력 처리
            document.addEventListener('keydown', (e)=>{
                console.log(e.keyCode);
                switch(e.keyCode){
                    case 37:     //left
                        for(let block of fallingBlocks){
                            if(!collisionLeft(block)){
                                block.x -= blockSize;
                            }
                        }
                        break;
                    case 39:    //right
                    case 38:    //up
                    case 40:    //down
                    case 32:    //space

                }
            });
        });
    </script>
</head>
<body>
    <div id="wrapper">
        <div id="aside">
            <div id="hold">
                <h2>HOLD</h2>
                <div></div>
            </div>
            <div id="data">
                <h2>SCORE</h2>
                <span></span>
                <h2>LEVEL</h2>
                <span></span>
            </div>
            <button>GAME START</button>
        </div>
        <div id="content">
            <div id="gameContainer">
                <div id="gameBoard"></div>
            </div>
        </div>
    </div>
</body>
</html>
